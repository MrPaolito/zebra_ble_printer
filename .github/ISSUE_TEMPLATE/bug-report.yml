name: Bug report
description: Something doesn't work as documented
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If it simply doesn't work on your printer model,
        please use the *Printer compatibility report* form instead.
        Known limitations are listed in the README.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Printer model and firmware
      placeholder: ZD410, firmware V84.20.10Z
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and OS version
      placeholder: iPhone 16e, iOS 26.0.1 / Pixel 7, Android 15
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The calls you made (scan, connect, reconnect, print...) in order.
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Exception text or console logs. Remove anything personal first.
      render: shell
