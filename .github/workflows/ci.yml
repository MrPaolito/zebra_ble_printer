name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      - name: Show what the Flutter tools rewrote in tracked files
        run: git diff
      - name: Restore tracked files, so the publish check sees the committed state
        run: git checkout -- .
      - run: flutter pub publish --dry-run
      - name: Analyze the example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
